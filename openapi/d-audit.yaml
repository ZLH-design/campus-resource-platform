openapi: 3.1.0

info:
  title: D-004 审计记录写入
  version: 0.1.0-draft
  description: |
    供 M1/M2/M3 写关键操作审计。

    **草案，待 D 确认后冻结。**

    设计原则：
    - 审计只记录"谁在什么时间对什么对象做了什么、结果如何"
    - **不承载业务逻辑判断**（见 INT-003，公共层不得重新实现业务规则）
    - 审计记录不可被普通用户修改

    按需求基线 §7.2，必须记录：登录、权限变更、审批、工单状态变化、预约取消、系统参数修改。

servers:
  - url: http://localhost:8084
    description: 本地 d-service
  - url: http://d-service:8084
    description: Docker Compose 内部网络

tags:
  - name: Audit
    description: 审计

paths:
  /api/d/audit-events:
    post:
      tags: [Audit]
      operationId: appendAuditEvent
      summary: 追加一条审计记录
      description: |
        **只增不改不删**，没有 PUT / DELETE。

        幂等：同一 `traceId + action + objectId` 重复提交不产生新记录，返回 200。
        （审计重复不致命，但会让报告失真，所以做去重。）

        写入失败不应阻断主业务：调用方按"尽力而为"处理，
        即审计失败只记日志、不回滚主流程。**但权限变更与审批操作例外 —— 这两类失败必须回滚。**
      parameters:
        - $ref: './common.yaml#/components/parameters/TraceId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventCommand'
            examples:
              ticketStatusChange:
                summary: M3 工单状态变化
                value:
                  action: TICKET_STATUS_CHANGE
                  operatorId: 3f1c9a2e-8b4d-4f6a-9e21-7c5d0b8a1f33
                  objectType: REPAIR_TICKET
                  objectId: 8d2b7c11-4e6a-4c3b-9f18-5a0e7d2c6b94
                  result: SUCCESS
                  detail: 待派单 -> 维修中
              reservationCancel:
                summary: M1 预约取消
                value:
                  action: RESERVATION_CANCEL
                  operatorId: 3f1c9a2e-8b4d-4f6a-9e21-7c5d0b8a1f33
                  objectType: RESERVATION
                  objectId: 5c9e2f13-7a4b-4d81-b3c6-9e0f2a7d4c58
                  result: SUCCESS
                  detail: 用户主动取消
              systemEvict:
                summary: M3 报修触发 M1 清退预约（SYSTEM 链路完整示例）
                value:
                  action: RESERVATION_EVICTED
                  operatorId: 00000000-0000-4000-8000-0000000000f1
                  actorType: SYSTEM
                  taskId: m1-evict-on-restriction
                  objectType: RESERVATION
                  objectId: 5c9e2f13-7a4b-4d81-b3c6-9e0f2a7d4c58
                  relatedRef:
                    sourceType: M3
                    sourceId: 8d2b7c11-4e6a-4c3b-9f18-5a0e7d2c6b94
                  result: SUCCESS
                  detail: 因维修工单清退
      responses:
        '200':
          description: 已记录（含幂等命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResult'
              example:
                auditId: 7a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                created: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    AuditEventCommand:
      type: object
      additionalProperties: false
      required: [action, operatorId, objectType, objectId, result]
      properties:
        action:
          $ref: './common.yaml#/components/schemas/AuditAction'
        operatorId:
          type: string
          format: uuid
          description: |
            操作者 UUID。人类操作 = 用户 ID；定时任务 = 系统服务账号的固定 UUID
            （见 common.yaml x-system-identity SI-2/SI-4）。
        actorType:
          type: string
          enum: [USER, SYSTEM]
          default: USER
          description: |
            SYSTEM 时 operatorId 为系统服务账号，且必须携带 taskId。
            与 common.yaml JwtClaims.actorType 同名同义。
        taskId:
          type: string
          description: |
            仅 `actorType=SYSTEM` 时必填。定时任务标识，如 `m1-checkin-timeout`。
            没有它，事后查审计只能看到一堆「系统取消的预约」，查不出是哪个任务干的。
        objectType:
          type: string
          enum: [USER, ROLE, RESERVATION, BOOKING_REQUEST, REPAIR_TICKET, ROOM, SYSTEM_PARAM]
        objectId:
          type: string
          format: uuid
        relatedRef:
          type: object
          additionalProperties: false
          description: |
            **原始来源追溯（可选但强烈建议）**。当本条审计的真正起因是另一个对象时填写。
            例：M1 清退预约（objectId=预约）的起因是 M3 报修工单 ——
            填 { sourceType: M3, sourceId: <工单UUID> }，
            事后才能从审计查出「这一串取消是哪张工单引起的」。
          properties:
            sourceType:
              type: string
              enum: [M1, M2, M3]
            sourceId:
              type: string
              format: uuid
        result:
          type: string
          enum: [SUCCESS, FAILURE]
        detail:
          type: string
          description: 简短说明，例如状态迁移描述。不含敏感信息

    AuditEventResult:
      type: object
      required: [auditId, created]
      properties:
        auditId:
          type: string
          format: uuid
        created:
          type: boolean
          description: true 表示新建；false 表示幂等命中

  responses:
    BadRequest:
      description: 参数非法（枚举越界、UUID 格式错、多传字段）
      content:
        application/json:
          schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' }
          example:
            code: INVALID_ARGUMENT
            message: action is not a valid enum value
            traceId: a1b2c3d4
    Unauthorized:
      description: 无 token 或失效
      content:
        application/json:
          schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' }
          example:
            code: UNAUTHORIZED
            message: missing or invalid bearer token
            traceId: a1b2c3d4
